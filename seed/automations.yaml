- id: demo_evening
  alias: "Вечерний сценарий"
  description: "Демонстрация действия «запустить автоматизацию» по нажатию на устройство"
  trigger: []
  action:
    - service: light.turn_on
      target: {entity_id: light.bed_light}
- id: demo_smoke_pulse
  alias: "Демо: дым каждые 10 минут на 30 секунд"
  description: "Показывает красную пульсацию тревоги на плане без участия зрителя"
  trigger:
    - platform: time_pattern
      minutes: "/10"
  action:
    - service: input_boolean.turn_on
      target: {entity_id: input_boolean.demo_smoke}
    - delay: "00:00:30"
    - service: input_boolean.turn_off
      target: {entity_id: input_boolean.demo_smoke}
  mode: single
