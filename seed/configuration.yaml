    initial: on
  curtain_right_open:
    name: "Backing: curtain right"
    initial: on
  lock_front_locked:
    name: "Backing: front door lock"
    initial: on
  lock_terrace_locked:
    name: "Backing: terrace door lock"
    initial: on
