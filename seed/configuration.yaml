# House Plan E2E seed — derived from the public demo stand (anonymized real
# house). An ephemeral Home Assistant boots from a copy of this folder for
# every run; scripts/prepare-seed.mjs writes the auth provider and uuid.
#
# Live values are frozen (houseplan-card#1010): the evidence frames of every
# run are diffed against the last stable release, so nothing on the plan may
# drift with the clock. The stand's `5` cadences read a fixed
# minute 5 here (doors closed, study occupied, motion idle, mid-range climate),
# sun-elevation sensors read a fixed afternoon (outdoor 16.3 °C, 266/209 lx),
# the 10-minute smoke demo is off, and the plan uses the static background
# without sun rays. Journeys still change state on purpose — through HA
# services, never through time.
default_config:

homeassistant:
  name: House Plan Demo
  latitude: 55.75
  longitude: 37.62
  elevation: 150
  unit_system: metric
  time_zone: Europe/Moscow
  country: RU
  currency: RUB
  # users: see scripts/prepare-seed.mjs (admin `demo`, viewer `viewer`)
  auth_providers:
    - type: homeassistant

# the demo house runs on template/helper entities + the `demo:` integration,
# no real hardware and no broker (see mqtt-plan.md: MQTT deliberately not used)
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.31.7.1
    - 127.0.0.1

logger:
  default: warning

frontend:
  extra_module_url:
    - /houseplan_files/houseplan-card.js

recorder:
  db_url: 'sqlite:////config/home-assistant_v2.db'
  purge_keep_days: 1

demo:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# --- checklist coverage (2026-08-08, stand v2) --------------------------------
# The scripted robot vacuum (demo/stand/demo_robot in the repo): a robot map
# sensor (same attribute shape the card reads for real vacuums) + a vacuum that drives a serpentine route through the plan
# rooms. Marker lives in the Under-Stairs Closet; do not touch the component.
demo_robot:

# Alarm demo: leaks are flipped by hand (Settings -> Devices & services ->
# Helpers), kitchen smoke fires by itself every 10 minutes (automations.yaml).
# All of them feed template binary_sensors so the red alarm pulse is showable.
input_boolean:
  demo_leak:
    name: "Demo: leak in the Guest WC (toggle)"
    icon: mdi:water-alert
  demo_leak_2:
    name: "Demo: leak in the Boiler Room (toggle)"
    icon: mdi:water-alert
  demo_smoke:
    name: "Demo: smoke in the Kitchen (auto-fires every 10 min)"
    icon: mdi:smoke-detector-variant
  demo_smoke_2:
    name: "Demo: smoke in the Boiler Room (toggle)"
    icon: mdi:smoke-detector-variant
  # backing state for the template lights: one helper per light group, every
  # lamp of the group follows it and toggles it back (same trick as v1's leak)
  lights_kitchen_living:
    name: "Backing: wall lights (Kitchen & Living)"
  lights_hallway:
    name: "Backing: hallway lights"
  lights_kids_room_a:
    name: "Backing: Kids Room A lights"
  lights_kids_room_b:
    name: "Backing: Kids Room B lights"
  study_dimmer_on:
    name: "Backing: study dimmer"
  kettle_night_light_on:
    name: "Backing: kettle night light"
  # backing state for template switches / covers / locks / fan
  kettle_power:
    name: "Backing: kettle"
  sauna_power:
    name: "Backing: sauna heater"
  fridge_express:
    name: "Backing: fridge express mode"
  washer_power:
    name: "Backing: washing machine"
    initial: on
  dryer_power:
    name: "Backing: dryer"
  hood_fan:
